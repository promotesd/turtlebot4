name: Mock integration

on:
  push:
    branches: [jazzy, "agent/**"]
  pull_request:
    branches: [jazzy]

jobs:
  repeated-episodes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install numpy pytest
      - name: Run deterministic 1000-reset contract
        env:
          PYTHONPATH: turtlebot4_rl_core:turtlebot4_rl_mock
        run: pytest -q turtlebot4_rl_mock/test/test_mock_backend.py
