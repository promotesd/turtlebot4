name: ROS 2 Jazzy build

on:
  push:
    branches: [jazzy, "agent/**"]
  pull_request:
    branches: [jazzy]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 0.7.16+ resolves ros-apt-source from a floating latest release; the
      # testing asset is not guaranteed to be published at the same time.
      - uses: ros-tooling/setup-ros@0.7.15
        with:
          required-ros-distributions: jazzy
      - name: Make ROS Python environment available
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -c "import ament_package, pathlib; print(pathlib.Path(ament_package.__file__).parents[1])" \
            | sudo tee /usr/lib/python3/dist-packages/ros-jazzy.pth >/dev/null
          env -u PYTHONPATH python3 -c "import ament_package"
          python3 -c "from ament_index_python.resources import get_resources; \
            assert get_resources('rosidl_typesupport_c')"
          echo "AMENT_PREFIX_PATH=${AMENT_PREFIX_PATH}" >> "${GITHUB_ENV}"
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" >> "${GITHUB_ENV}"
          echo "PYTHONPATH=${PYTHONPATH}" >> "${GITHUB_ENV}"
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          # Regular installs keep dependent Python packages importable when
          # action-ros-ci starts tests from the underlay-only environment.
          no-symlink-install: true
          package-name: >-
            turtlebot4_description turtlebot4_msgs turtlebot4_navigation turtlebot4_node
            turtlebot4_rl_interfaces turtlebot4_rl_core turtlebot4_rl_mock
            turtlebot4_rl_ros turtlebot4_rl_gz turtlebot4_dqn
            turtlebot4_rl_bringup turtlebot4_machine_learning
