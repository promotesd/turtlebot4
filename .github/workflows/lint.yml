name: Static checks

on:
  push:
    branches: [jazzy, "agent/**"]
  pull_request:
    branches: [jazzy]

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python -m pip install mypy numpy ruff yamllint
      - run: >-
          ruff check turtlebot4_rl_core turtlebot4_rl_mock turtlebot4_rl_ros
          turtlebot4_rl_gz turtlebot4_dqn turtlebot4_rl_bringup scripts examples
      - name: Check backend-independent packages with mypy
        env:
          MYPYPATH: turtlebot4_rl_core:turtlebot4_rl_mock:turtlebot4_dqn
        run: >-
          mypy turtlebot4_rl_core/turtlebot4_rl_core
          turtlebot4_rl_mock/turtlebot4_rl_mock turtlebot4_dqn/turtlebot4_dqn
      - run: >-
          python -m compileall -q turtlebot4_rl_core turtlebot4_rl_mock
          turtlebot4_rl_ros turtlebot4_rl_gz turtlebot4_dqn turtlebot4_rl_bringup
          scripts examples
      - name: Check project YAML
        run: >-
          yamllint .github turtlebot4_dqn/turtlebot4_dqn/config
          turtlebot4_rl_bringup/config CITATION.cff
